# GitHub Actions Deploy-Image workflow
#
# Builds a multi-arch Docker image (amd64 + arm64) and pushes it to GHCR
# every time `deploy` is updated, under these tags:
#
#   :deploy       moving tag, always the head of `deploy` (the NAS pulls it)
#   :sha-<short>  immutable tag for that exact commit (use it to roll back)
#
# After this workflow finishes, deploying to the NAS is just:
#
#   docker compose pull app
#   docker compose up -d --force-recreate app
#
# No manual `docker buildx build --push` from a dev machine needed anymore.
# The arm64 build runs under QEMU emulation on the GitHub-hosted runner,
# so it takes noticeably longer than an amd64-only build (expect 15-25min).
# This runs in the background on GitHub's infrastructure, it doesn't block
# local work.

name: Deploy Image

on:
  push:
    branches:
      - deploy

# Cancel an in-progress run if deploy is pushed again before it finishes,
# so we don't waste runner time building an image that's already stale.
concurrency:
  group: deploy-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker registry names must be lowercase; github.repository preserves
      # the repo's actual casing (mio2611/Chessstack), which fails the build.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=deploy
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=deploy-image
          cache-to: type=gha,mode=max,scope=deploy-image
